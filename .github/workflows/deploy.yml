name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Reading the CI conclusion for this commit.
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # D1 migrations are forward-only, so the release gate has to pass before the
  # deploy job starts rather than alongside it. `pnpm check` is the same gate
  # `pnpm dev` users run locally; it is repeated here rather than inherited from
  # CI because workflow_dispatch can select any ref, including one CI never saw.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # format:check, lint, typecheck, unit and Worker coverage, analyze,
      # cf-typegen:check, and both builds.
      - run: pnpm check

      # `pnpm check` omits the browser suite, which CI runs. A tag push starts
      # both workflows at once, so wait for CI on this exact commit rather than
      # racing it. A ref CI never ran on has no conclusion to read and is
      # covered by the gate above.
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            run=$(gh api \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status // "") \(.conclusion // "")"')
            status=${run% *}
            conclusion=${run#* }
            if [ -z "${status}" ]; then
              echo "No CI run for ${SHA}; the release gate above is the only check."
              exit 0
            fi
            if [ "${status}" = "completed" ]; then
              echo "CI for ${SHA} concluded: ${conclusion}"
              if [ "${conclusion}" = "success" ]; then
                exit 0
              fi
              echo "Refusing to deploy a commit whose CI did not pass." >&2
              exit 1
            fi
            echo "Attempt ${attempt}: CI for ${SHA} is ${status}; waiting."
            sleep 60
          done
          echo "CI for ${SHA} did not complete in time." >&2
          exit 1

  deploy:
    name: Deploy to production
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: Worker dry run
        run: pnpm build:worker

      # Migrations must complete before the Worker is deployed. The Worker
      # queries the search, reference, mention, deletion-job, archive-disconnect,
      # and table-state tables on ordinary request paths.
      - name: Apply D1 migrations
        run: pnpm wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: pnpm wrangler deploy

      - name: Health check
        if: vars.PRODUCTION_BASE_URL != ''
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 "${BASE_URL}/api/health" || true)
            if [ -n "${body}" ]; then
              echo "${body}"
              case "${body}" in
                *'"ok":true'*) echo "Health check passed."; exit 0 ;;
              esac
            fi
            echo "Attempt ${attempt} failed; retrying."
            sleep 10
          done
          echo "Health check did not pass after 5 attempts." >&2
          exit 1

      - name: Deployed version
        run: pnpm wrangler deployments list
