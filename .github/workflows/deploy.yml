name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_page_move_receipt_migration_safe:
        description: Page moves are quiesced, or the live Worker already reads versioned receipts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # D1 migrations are forward-only, so the release gate has to pass before the
  # deploy job starts rather than alongside it. Successful main-branch CI runs
  # trigger this workflow after completion; a manual dispatch can select a ref
  # CI never saw, so that path runs `pnpm check` here instead.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_deploy: ${{ steps.target.outputs.should_deploy }}
      deploy_sha: ${{ steps.target.outputs.deploy_sha }}
    steps:
      - name: Select deployment target
        id: target
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ "${CI_CONCLUSION}" != "success" ]; then
              echo "CI concluded ${CI_CONCLUSION}; no deployment will start."
              echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            current_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
            if [ "${CI_SHA}" != "${current_sha}" ]; then
              echo "CI passed for superseded commit ${CI_SHA}; main is ${current_sha}."
              echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            deploy_sha=${CI_SHA}
          else
            deploy_sha=${MANUAL_SHA}
          fi
          echo "Deploying ${deploy_sha}."
          echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          echo "deploy_sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: github.event_name == 'workflow_dispatch'
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: pnpm
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      # format:check, lint, typecheck, unit and Worker coverage, analyze,
      # cf-typegen:check, and both builds. Successful CI completion covers the
      # automatic path, so only a manual deployment repeats this local suite.
      - name: Full check
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check

  deploy:
    name: Deploy to production
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.deploy_sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Gate page-move receipt migration
        shell: bash
        env:
          PAGE_MOVE_RECEIPT_MIGRATION_SAFE: ${{ inputs.confirm_page_move_receipt_migration_safe }}
        run: |
          pending_migrations=$(mktemp)
          trap 'rm -f "${pending_migrations}"' EXIT
          pnpm wrangler d1 migrations list DB --env production --remote | tee "${pending_migrations}"
          if grep -Fq "0011_page_move_receipt_envelopes.sql" "${pending_migrations}"; then
            if [ "${PAGE_MOVE_RECEIPT_MIGRATION_SAFE}" != "true" ]; then
              echo "0011 requires a manually confirmed safe upgrade." >&2
              echo "Quiesce page moves or deploy a compatible bridge Worker, then run this workflow manually with the 0011 confirmation checked." >&2
              exit 1
            fi
          fi

      - name: Validate production health origin
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: node scripts/check-production-origin.mjs

      - name: Production build
        run: pnpm build

      - name: Worker dry run
        run: pnpm build:worker

      # Migrations must complete before the Worker is deployed. The Worker
      # queries the search, reference, mention, deletion-job, archive-disconnect,
      # and table-state tables on ordinary request paths.
      - name: Apply D1 migrations
        run: pnpm wrangler d1 migrations apply DB --env production --remote

      - name: Deploy Worker
        run: pnpm wrangler deploy --env production

      - name: Health check
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 "${BASE_URL}/api/health" || true)
            if [ -n "${body}" ]; then
              echo "${body}"
              case "${body}" in
                *'"ok":true'*) echo "Health check passed."; exit 0 ;;
              esac
            fi
            echo "Attempt ${attempt} failed; retrying."
            sleep 10
          done
          echo "Health check did not pass after 5 attempts." >&2
          exit 1

      - name: Deployed version
        run: pnpm wrangler deployments list --env production
