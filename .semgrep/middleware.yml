rules:
  - id: worker-hono-direct-middleware-registration
    languages: [typescript]
    message: Register Worker middleware through registerMetricMiddleware so metric route attribution remains correct.
    severity: ERROR
    pattern-either:
      - pattern: app.use(...)
      - pattern: notionApi.use(...)
      - pattern: app.on(...)
      - pattern: notionApi.on(...)
      - pattern: app.all(...)
      - pattern: notionApi.all(...)

  - id: worker-hono-multiple-handlers
    languages: [typescript]
    message: Worker routes must have one terminal handler; register middleware through registerMetricMiddleware.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: app.$METHOD($PATH, $MIDDLE, $LAST, ...)
          - pattern: notionApi.$METHOD($PATH, $MIDDLE, $LAST, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|delete|patch|options|head|connect|trace)$

  - id: worker-hono-computed-registration
    languages: [typescript]
    message: Do not hide Worker route or middleware registration behind computed property access.
    severity: ERROR
    pattern-either:
      - pattern: app[$METHOD](...)
      - pattern: notionApi[$METHOD](...)

  - id: worker-hono-registration-alias
    languages: [typescript]
    message: Do not alias or destructure Worker Hono registration methods.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: const $ALIAS = app.$METHOD
          - pattern: let $ALIAS = app.$METHOD
          - pattern: $ALIAS = app.$METHOD
          - pattern: const $ALIAS = notionApi.$METHOD
          - pattern: let $ALIAS = notionApi.$METHOD
          - pattern: $ALIAS = notionApi.$METHOD
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(use|on|all|get|post|put|delete|patch|options|head|connect|trace)$

  - id: worker-hono-registration-destructure
    languages: [typescript]
    message: Do not destructure Worker Hono registration methods.
    severity: ERROR
    pattern-either:
      - pattern: const { ... } = app
      - pattern: let { ... } = app
      - pattern: const { ... } = notionApi
      - pattern: let { ... } = notionApi

  - id: worker-hono-app-alias
    languages: [typescript]
    message: Do not alias a known Worker Hono app; registration policy relies on its reviewed identifier.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: const $ALIAS = app
          - pattern: let $ALIAS = app
          - pattern: $ALIAS = app
          - pattern: const $ALIAS = notionApi
          - pattern: let $ALIAS = notionApi
          - pattern: $ALIAS = notionApi
      - metavariable-regex:
          metavariable: $ALIAS
          regex: ^[A-Za-z_$][A-Za-z0-9_$]*$

  - id: worker-hono-app-escape
    languages: [typescript]
    message: Do not pass a Worker Hono app through an unreviewed function; register middleware directly through the sanctioned helper.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $CALLEE(..., app, ...)
          - pattern: $CALLEE(..., notionApi, ...)
      - pattern-not: registerMetricMiddleware(...)
      - pattern-not: app.route(...)

  - id: worker-hono-construction
    languages: [typescript]
    message: New Worker Hono apps require explicit review and addition to the middleware policy.
    severity: ERROR
    pattern-either:
      - pattern: new Hono(...)
      - pattern: new $MODULE.Hono(...)

  - id: worker-hono-import-alias
    languages: [typescript]
    message: Import Hono by its reviewed name so new Worker app construction remains enforceable.
    severity: ERROR
    pattern: import { Hono as $ALIAS } from "hono"

  - id: worker-hono-known-app-import-alias
    languages: [typescript]
    message: Import the reviewed Worker Hono app by its policy-covered name.
    severity: ERROR
    pattern: import { notionApi as $ALIAS } from "./notion-api"
